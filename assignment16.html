
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student Registration Form - HTML assignment">
  <title>Student Registration Form</title>
</head>

<body>

  <header>
    <h1>Student Registration Form</h1>
    <p>Enter your details to complete the registration form.</p>
  </header>

  <main>
    <form action="#" method="post">

      <p>
        <label for="name">Full Name:</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Harikishan Yadav"
          required>
      </p>

      <p>
        <label for="email">Email Address:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="harikishanyadav076@gmail.com"
          required>
      </p>

      <p>
        <label for="phone">Phone Number:</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          pattern="[0-9]{10}"
          placeholder="Enter 10 digit number"
          title="Please enter a 10-digit phone number"
          required>
      </p>

      <p>
        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          minlength="8"
          placeholder="Minimum 8 characters"
          required>
      </p>

      <fieldset>
        <legend>Gender:</legend>

        <label>
          <input type="radio" name="gender" value="male" required>
          Male
        </label>

        <label>
          <input type="radio" name="gender" value="female">
          Female
        </label>

        <label>
          <input type="radio" name="gender" value="other">
          Other
        </label>
      </fieldset>

      <p>
        <label for="course">Select Course:</label>

        <select id="course" name="course" required>
          <option value="">-- Select Your Course --</option>
          <option value="bca-ai">BCA Artificial Intelligence</option>
          <option value="bca">BCA</option>
          <option value="btech-cse">B.Tech Computer Science</option>
          <option value="bsc-it">B.Sc Information Technology</option>
        </select>
      </p>

      <p>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
      </p>

      <p>
        <label>
          <input type="checkbox" name="terms" required>
          I agree to the terms and conditions.
        </label>
      </p>

      <button type="submit">Register</button>
      <button type="reset">Clear Form</button>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Student Registration Form</p>
  </footer>

</body>

</html>
