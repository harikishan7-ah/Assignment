
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive photo gallery built with CSS Grid.">

  <title>My Photo Gallery | CSS Grid</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111111;
      color: #ffffff;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 0.5rem;
      font-size: 2.2rem;
    }

    .intro {
      text-align: center;
      color: #cccccc;
      margin-bottom: 2rem;
    }

    /* CSS Grid gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: 180px;
      gap: 12px;

      max-width: 1100px;
      margin: 0 auto;
    }

    /* Individual image card */
    .gallery figure {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: #333333;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .gallery figure:hover img {
      transform: scale(1.08);
    }

    /* Image captions */
    .gallery figcaption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      padding: 0.75rem;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
      color: #ffffff;
      font-size: 0.9rem;
    }

    /* Different image sizes */
    .wide {
      grid-column: span 2;
    }

    .tall {
      grid-row: span 2;
    }

    .big {
      grid-column: span 2;
      grid-row: span 2;
    }

    /* Tablet layout */
    @media (max-width: 800px) {
      body {
        padding: 1.25rem;
      }

      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* Mobile layout */
    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }

      h1 {
        font-size: 1.8rem;
      }

      .gallery {
        grid-template-columns: 1fr;
        grid-auto-rows: 220px;
      }

      .wide,
      .big {
        grid-column: auto;
      }

      .tall,
      .big {
        grid-row: span 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .gallery img {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>My Gallery</h1>
    <p class="intro">A collection of beautiful nature photographs</p>
  </header>

  <main>
    <section class="gallery" aria-label="Nature photo gallery">

      <figure class="big">
        <img
          src="https://picsum.photos/id/1015/800/800"
          alt="River winding through a green valley"
          loading="lazy"
        >
        <figcaption>River Valley</figcaption>
      </figure>

      <figure>
        <img
          src="https://picsum.photos/id/1016/400/400"
          alt="Mountain landscape"
          loading="lazy"
        >
        <figcaption>Mountain Landscape</figcaption>
      </figure>

      <figure class="tall">
        <img
          src="https://picsum.photos/id/1018/400/800"
          alt="Misty mountain peak"
          loading="lazy"
        >
        <figcaption>Misty Peak</figcaption>
      </figure>

      <figure>
        <img
          src="https://picsum.photos/id/1019/400/400"
          alt="Wooden jetty beside a lake"
          loading="lazy"
        >
        <figcaption>Peaceful Lake</figcaption>
      </figure>

      <figure class="wide">
        <img
          src="https://picsum.photos/id/1036/800/400"
          alt="Snow-covered pine forest"
          loading="lazy"
        >
        <figcaption>Winter Forest</figcaption>
      </figure>

      <figure>
        <img
          src="https://picsum.photos/id/1039/400/400"
          alt="Waterfall surrounded by green plants"
          loading="lazy"
        >
        <figcaption>Waterfall</figcaption>
      </figure>

      <figure>
        <img
          src="https://picsum.photos/id/1043/400/400"
          alt="Evening sky over an open field"
          loading="lazy"
        >
        <figcaption>Evening Sky</figcaption>
      </figure>

    </section>
  </main>

</body>

</html>
