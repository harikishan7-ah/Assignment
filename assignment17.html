
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Job application form - HTML assignment">
  <title>Job Application Form</title>
</head>

<body>

  <header>
    <h1>Job Application - Front-End Developer</h1>
    <p>Complete the form below to apply for a position.</p>
  </header>

  <main>
    <form action="#" method="post" enctype="multipart/form-data">

      <fieldset>
        <legend>Personal Details</legend>

        <p>
          <label for="fullname">Full Name:</label>
          <input type="text" id="fullname" name="fullname"
                 placeholder="Harikishan Yadav" required>
        </p>

        <p>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email"
                 placeholder="harikishanyadav076@gmail.com" required>
        </p>

        <p>
          <label for="phone">Phone:</label>
          <input type="tel" id="phone" name="phone"
                 pattern="[0-9]{10}" placeholder="10 digit number">
        </p>

        <p>
          <label for="dob">Date of Birth:</label>
          <input type="date" id="dob" name="dob">
        </p>

        <p>
          <label for="website">Portfolio URL:</label>
          <input type="url" id="website" name="website"
                 placeholder="https://example.com">
        </p>

        <p>
          <label for="password">Create Password:</label>
          <input type="password" id="password" name="password"
                 minlength="8">
        </p>
      </fieldset>

      <fieldset>
        <legend>Job Details</legend>

        <p>
          <label for="position">Position:</label>
          <select id="position" name="position" required>
            <option value="">-- Select Position --</option>
            <option value="frontend">Front-End Developer</option>
            <option value="designer">UI Designer</option>
            <option value="tester">QA Tester</option>
          </select>
        </p>

        <p>
          <label for="joining">Earliest Joining Date:</label>
          <input type="date" id="joining" name="joining">
        </p>

        <p>
          <label for="interview">Interview Slot:</label>
          <input type="datetime-local" id="interview" name="interview">
        </p>

        <p>
          <label for="month">Preferred Start Month:</label>
          <input type="month" id="month" name="month">
        </p>

        <p>
          <label for="week">Preferred Week:</label>
          <input type="week" id="week" name="week">
        </p>

        <p>
          <label for="time">Best Call Time:</label>
          <input type="time" id="time" name="time">
        </p>

        <p>
          <label for="experience">Years of Experience:</label>
          <input type="number" id="experience" name="experience"
                 min="0" max="40" value="0">
        </p>

        <p>
          <label for="salary">Expected Salary (₹ LPA):</label>
          <input type="range" id="salary" name="salary"
                 min="2" max="30" value="6"
                 oninput="salaryOutput.value = this.value">
          <output id="salaryOutput">6</output> LPA
        </p>

        <p>
          <label for="colour">Favourite Colour:</label>
          <input type="color" id="colour" name="colour"
                 value="#3366ff">
        </p>

        <p>
          <label for="skills">Skills:</label>
          <input list="skill-options" id="skills" name="skills">

          <datalist id="skill-options">
            <option value="HTML">
            <option value="CSS">
            <option value="JavaScript">
            <option value="Java">
            <option value="Git">
          </datalist>
        </p>

        <p>
          <label for="search">Search Company Policy:</label>
          <input type="search" id="search" name="search">
        </p>
      </fieldset>

      <fieldset>
        <legend>Preferred Work Mode</legend>

        <label>
          <input type="radio" name="workmode" value="onsite" checked>
          On-site
        </label>

        <label>
          <input type="radio" name="workmode" value="remote">
          Remote
        </label>

        <label>
          <input type="radio" name="workmode" value="hybrid">
          Hybrid
        </label>
      </fieldset>

      <fieldset>
        <legend>Technologies Known</legend>

        <label>
          <input type="checkbox" name="technology" value="html">
          HTML
        </label>

        <label>
          <input type="checkbox" name="technology" value="css">
          CSS
        </label>

        <label>
          <input type="checkbox" name="technology" value="javascript">
          JavaScript
        </label>

        <label>
          <input type="checkbox" name="technology" value="java">
          Java
        </label>
      </fieldset>

      <fieldset>
        <legend>Additional Information</legend>

        <p>
          <label for="resume">Upload Resume (PDF):</label>
          <input type="file" id="resume" name="resume" accept=".pdf">
        </p>

        <p>
          <label for="coverletter">Cover Letter:</label><br>
          <textarea id="coverletter" name="coverletter"
                    rows="5" cols="50" maxlength="500"
                    placeholder="Write a short introduction..."></textarea>
        </p>
      </fieldset>

      <input type="hidden" name="source" value="careers-page">

      <p>
        <label>
          <input type="checkbox" name="agreement" required>
          I confirm that the information provided is correct.
        </label>
      </p>

      <p>
        <button type="submit">Apply Now</button>
        <button type="reset">Reset Form</button>
        <button type="button" onclick="window.print()">Print Form</button>
      </p>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Job Application Form</p>
  </footer>

</body>

</html>
