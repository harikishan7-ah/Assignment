
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A perfectly centred login form using CSS Flexbox.">

  <title>Centred Login Form</title>

  <style>
    /* Apply box-sizing to all elements */
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    /* Centre the login form horizontally and vertically */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: Arial, sans-serif;
    }

    /* Login card */
    .login {
      display: flex;
      flex-direction: column;
      gap: 1rem;

      width: 100%;
      max-width: 380px;
      padding: 2rem;

      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .login h1 {
      margin: 0 0 0.5rem;
      text-align: center;
      color: #333333;
    }

    /* Email and password fields */
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-weight: 600;
      color: #333333;
    }

    .field input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font: inherit;
    }

    .field input:focus {
      outline: 3px solid #c3b5ff;
      border-color: #764ba2;
    }

    /* Remember me and forgot password */
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    .row label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .row a {
      color: #764ba2;
    }

    /* Login button */
    button {
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      background: #764ba2;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #5d3a85;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #c3b5ff;
      outline-offset: 3px;
    }
  </style>
</head>

<body>

  <form class="login" action="#" method="post">

    <h1>Welcome Back</h1>

    <label class="field">
      Email
      <input
        type="email"
        name="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >
    </label>

    <label class="field">
      Password
      <input
        type="password"
        name="password"
        placeholder="Enter your password"
        minlength="8"
        autocomplete="current-password"
        required
      >
    </label>

    <div class="row">
      <label>
        <input type="checkbox" name="remember">
        Remember me
      </label>

      <a href="#">Forgot password?</a>
    </div>

    <button type="submit">Log In</button>

  </form>

</body>

</html>
