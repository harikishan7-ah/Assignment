
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive navigation menu using CSS Flexbox">
    <title>Flexbox Menu Bar</title>

    <style>
        /* Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        /* Navigation Menu */
        .menu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1d3557;
            padding: 0 1.5rem;
            flex-wrap: wrap;
        }

        /* Brand Name */
        .menu__brand {
            color: #fff;
            font-weight: 800;
            font-size: 1.3rem;
            padding: 1rem 0;
        }

        /* Navigation Links */
        .menu__list {
            display: flex;
            list-style: none;
        }

        .menu__list a {
            display: block;
            color: #fff;
            text-decoration: none;
            padding: 1rem 1.1rem;
            transition: background 0.2s;
        }

        /* Hover Effect */
        .menu__list a:hover,
        .menu__list a.active {
            background: #457b9d;
        }

        /* Sign Up Button */
        .menu__cta {
            margin-left: 1rem;
            background: #e63946;
            color: #fff;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            text-decoration: none;
        }

        .menu__cta:hover {
            background: #c92a37;
        }

        /* Main Content */
        main {
            padding: 2rem;
            text-align: center;
        }

        main h1 {
            color: #1d3557;
            margin-bottom: 1rem;
        }

        /* Responsive Design */
        @media (max-width: 640px) {
            .menu {
                flex-direction: column;
                align-items: stretch;
                padding: 0;
            }

            .menu__brand {
                text-align: center;
            }

            .menu__list {
                flex-direction: column;
                text-align: center;
            }

            .menu__cta {
                margin: 0.75rem 1rem;
                text-align: center;
            }

            main {
                padding: 1.5rem 1rem;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="menu" aria-label="Main navigation">

        <div class="menu__brand">MyBrand</div>

        <ul class="menu__list">
            <li><a class="active" href="#home">Home</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#portfolio">Portfolio</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>

        <a class="menu__cta" href="#signup">Sign Up</a>

    </nav>

    <!-- Page Content -->
    <main id="home">
        <h1>Welcome to My Website</h1>
        <p>Resize your browser window to see the responsive menu.</p>
        <p>On smaller screens, the navigation links stack vertically.</p>
    </main>

</body>
</html>
